[package]
name = "sigil"
version = "0.4.0-rc.0"
edition = "2024"

[dependencies]
#lora = { path = "../lora", default-features = false, features = ["sx1278"] }
lora = { version = "0.3.0-rc.0", registry = "forgejorc",default-features = false, features = ["sx1278"] }

embedded-hal = "1.0.0"

log = { version = "0.4", default-features = false }

bincode = { version = "2.0.0", default-features = false, features = ["derive"] }
chacha20poly1305 = {version="0.10.1",default-features = false,features = ["heapless"]}
heapless = "0.9.2"
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["oid"] }

[features]
models = []
com = []

[dev-dependencies]
embedded-hal-mock= {version="0.11.1",features=["eh1"]}
#lora = { path = "../lora", default-features = false, features = ["test-support"] }
lora = { version = "0.3.0-rc.0", registry = "forgejorc",default-features = false, features = ["test-support"] }
