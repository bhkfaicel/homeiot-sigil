[package]
name = "sigil"
version = "1.0.0"
edition = "2024"

[features]
# Development/tests keep both roles. Products should disable defaults and
# select only the role they ship.
default = ["sensor", "gateway"]
sensor = []
gateway = []

[dependencies]
# Cryptographic primitives
chacha20poly1305 = { version = "0.10.1", default-features = false }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
# Renew eph↔eph only. Install/resume identity ECDH stays on SecureElement (P-256).
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
# Direct dep for constant-time MAC compares (already transitive via AEAD / dalek).
subtle = { version = "2.6", default-features = false }

# Data structures and encoding
heapless = "0.8"
