[package]
name = "sigil"
version = "0.1.0"
edition = "2024"

[dependencies]
lora = { version = "0.1", registry = "forgejo",default-features = false, features = ["sx1278"] }
embedded-hal = "1.0.0"

bincode = { version = "2.0", default-features = false, features = ["derive"] }
chacha20poly1305 = {version="0.10.1",default-features = false,features = ["heapless"]}
heapless = "0.8"
#heapless = "0.9.2"  # Downgraded to 0.8 for rustc 1.85.0 compatibility in cross
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["oid"] }

[features]
models = []
com = []

[dev-dependencies]
embedded-hal-mock= {version="0.11.1",features=["eh1"]}
lora = { version = "0.1", registry = "forgejo",default-features = false, features = ["test-support"] }

