name: Enforce branch flow

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-flow:
    runs-on: docker
    steps:
      - name: Validate source and target branches
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ forgejo.base_ref }}"
          HEAD="${{ forgejo.head_ref }}"

          echo "PR flow: ${HEAD} -> ${BASE}"

          ALLOWED="false"

          if [ "$BASE" = "dev" ]; then
            ALLOWED="true"
          elif [ "$BASE" = "staging" ] && [ "$HEAD" = "dev" ]; then
            ALLOWED="true"
          elif [ "$BASE" = "main" ] && [ "$HEAD" = "staging" ]; then
            ALLOWED="true"
          fi

          if [ "$ALLOWED" != "true" ]; then
            echo "Merge not allowed: ${HEAD} -> ${BASE}"
            echo "Allowed flows are:"
            echo "  * -> dev"
            echo "  dev -> staging"
            echo "  staging -> main"
            exit 1
          fi

          echo "Merge allowed: ${HEAD} -> ${BASE}"

  lint-and-test:
    runs-on: docker
    env:
      CARGO_REGISTRIES_FORGEJO_TOKEN: "Bearer ${{ secrets.RUNNER_TOKEN }}"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ forgejo.event.pull_request.head.sha }}
          token: ${{ secrets.RUNNER_TOKEN }}

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.94.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Lint (clippy)
        run: cargo clippy -- -D warnings

      - name: Install cargo-machete
        run: cargo install cargo-machete

      - name: Unused dependencies (cargo machete)
        run: cargo machete

      - name: Run tests
        run: bash scripts/test.sh