name: Enforce branch flow

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-flow:
    runs-on: docker
    steps:
      - name: Validate source and target branches
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ forgejo.base_ref }}"
          HEAD="${{ forgejo.head_ref }}"

          echo "PR flow: ${HEAD} -> ${BASE}"

          ALLOWED="false"

          if [ "$BASE" = "dev" ]; then
            ALLOWED="true"
          elif [ "$BASE" = "staging" ] && [ "$HEAD" = "dev" ]; then
            ALLOWED="true"
          elif [ "$BASE" = "main" ] && [ "$HEAD" = "staging" ]; then
            ALLOWED="true"
          fi

          if [ "$ALLOWED" != "true" ]; then
            echo "Merge not allowed: ${HEAD} -> ${BASE}"
            echo "Allowed flows are:"
            echo "  * -> dev"
            echo "  dev -> staging"
            echo "  staging -> main"
            exit 1
          fi

          echo "Merge allowed: ${HEAD} -> ${BASE}"