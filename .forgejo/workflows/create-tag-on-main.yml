name: Create tag on main

on:
  push:
    branches: [main]

jobs:
  checks:
    uses: ./.forgejo/workflows/_rust-crate-checks.yml
    secrets: inherit

  tag:
    needs: checks
    runs-on: docker
    container:
      image: code.bhk-itsolutions.com/homeiot/ci-rust-embedded:rust-1.97.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.RUNNER_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Create stable tag and maintenance branch
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "error: Cargo.toml version must be stable X.Y.Z" >&2
            exit 1
          fi
          TAG_NAME="v${VERSION}"
          RELEASE_BRANCH="release/${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          git config user.name CI
          git config user.email ci@forgejo
          git remote set-url origin "https://code.bhk-itsolutions.com/${REPOSITORY}.git"
          ASKPASS="$(mktemp)"
          trap 'rm -f "$ASKPASS"' EXIT
          printf '%s\n' '#!/bin/sh' 'case "$1" in' \
            '  *Username*) printf "%s\n" git ;;' \
            '  *) printf "%s\n" "$REPO_ACCESS_TOKEN" ;;' 'esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q .; then
            echo "error: ${TAG_NAME} already exists; bump the version" >&2
            exit 1
          fi
          git tag "$TAG_NAME"
          GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$ASKPASS" git push origin "$TAG_NAME"
          if git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | grep -q .; then
            echo "${RELEASE_BRANCH} already exists; leaving it unchanged"
          else
            git branch "$RELEASE_BRANCH" "$TAG_NAME"
            GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$ASKPASS" git push origin "$RELEASE_BRANCH"
          fi
