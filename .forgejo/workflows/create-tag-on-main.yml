# On push to main: run shared Rust checks, then create/push stable tag vX.Y.Z
# and ensure the release/X.Y maintenance branch exists.
# Implementation: faicel/central_ci create_tag_on_main.yml.
# Repository is auto-detected from github.repository (caller).
#
# Publishing is done by publish-on-tag.yml on the tag push (forgejo registry).
# test_command: the crate's authoritative gate (locked feature matrix, rustdoc,
# embedded-target cross-checks). The plain `cargo test` default is invalid here:
# the empty feature set is rejected at compile time by design.

name: Create tag on main

on:
  push:
    branches:
      - main

jobs:
  tag:
    uses: faicel/central_ci/.forgejo/workflows/create_tag_on_main.yml@main
    with:
      test_command: bash scripts/test.sh
    secrets:
      RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
