# On push to dev: create and push prerelease tag vX.Y.Z-rc.N.
# Lint and tests are run on pull_request (enforce-branch-flow workflow).
# Does not publish the crate. The tag push triggers publish-on-tag which creates a Forgejo release with prerelease: true.
# Requires: RUNNER_TOKEN secret (PAT with read repo and push for tags).
#
# Adapt repo URL if your Forgejo instance or repo path differ.

name: Create prerelease tag on dev

on:
  push:
    branches:
      - dev

jobs:
  tag_prerelease:
    runs-on: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RUNNER_TOKEN }}
          fetch-depth: 0

      - name: Create and push prerelease tag
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          set -e
          VERSION=$(sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "$VERSION" != *-rc* ]]; then
            echo "Error: version '$VERSION' does not contain '-rc'. Set a prerelease version (e.g. 0.2.1-rc.1) before pushing to dev."
            exit 1
          fi
          TAG_NAME="v${VERSION}"
          echo "Creating prerelease tag $TAG_NAME (version $VERSION)"
          git config user.name "CI"
          git config user.email "ci@forgejo"
          git tag "$TAG_NAME" 2>/dev/null || echo "Tag $TAG_NAME already exists locally, skipping creation"
          git remote set-url origin "https://${REPO_ACCESS_TOKEN}@code.bhk-itsolutions.com/homeiot/sigil.git"
          git push origin "$TAG_NAME"
