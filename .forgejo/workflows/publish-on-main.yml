# On push to main: run tests, create tag from Cargo.toml version, publish to Forgejo registry.
# Requires: RUNNER_TOKEN secret (PAT with read repo + write:package, and push for tags).
# Configure .cargo/config.toml or Cargo.toml [package] publish = ["forgejo"] and registry config.
#
# Adapt REPO_OWNER/REPO_NAME and API_URL if your Forgejo instance or repo path differ.

name: Publish crate to Forgejo registry

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: docker
    env:
      CARGO_REGISTRIES_FORGEJO_TOKEN: "Bearer ${{ secrets.RUNNER_TOKEN }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RUNNER_TOKEN }}

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show Rust and Cargo versions
        run: |
          rustc --version
          cargo --version

      - name: Run tests
        run: bash scripts/test.sh

      - name: Create and push tag from Cargo.toml version
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^version\s*=\s*"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          TAG_NAME="v${VERSION}"
          echo "Creating tag $TAG_NAME from Cargo.toml version $VERSION"
          git config user.name "CI"
          git config user.email "ci@forgejo"
          git tag "$TAG_NAME" 2>/dev/null || echo "Tag $TAG_NAME already exists locally, skipping creation"
          git remote set-url origin "https://${REPO_ACCESS_TOKEN}@code.bhk-itsolutions.com/homeiot/sigil.git"
          git push origin "$TAG_NAME"

      - name: Publish crate to Forgejo registry
        run: cargo publish --registry forgejo
