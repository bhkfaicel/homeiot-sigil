# On push of tag v*: run tests, create Forgejo release, and publish crate (stable tags only).
# Requires: RUNNER_TOKEN secret (PAT with read repo + write for releases + write:package).
#
# Adapt API_URL and owner/repo if your Forgejo instance or repo path differ.

name: Create Forgejo release on tag

on:
  push:
    tags:
      - "v*"

jobs:
  release_on_tag:
    runs-on: docker
    env:
      CARGO_REGISTRIES_FORGEJO_TOKEN: "Bearer ${{ secrets.RUNNER_TOKEN }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RUNNER_TOKEN }}

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.94.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Lint (clippy)
        run: cargo clippy -- -D warnings

      - name: Install cargo-machete
        run: cargo install cargo-machete

      - name: Unused dependencies (cargo machete)
        run: cargo machete
      

      - name: Run tests
        run: bash scripts/test.sh

      - name: Create Forgejo release
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^version\s*=\s*"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          TAG_NAME="${GITHUB_REF_NAME:-v${VERSION}}"
          if [[ "$TAG_NAME" == *-rc* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          CRATE_NAME=$(sed -n 's/^name\s*=\s*"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "Creating Forgejo release $TAG_NAME for crate $CRATE_NAME (prerelease=$PRERELEASE)"
          API_URL="https://code.bhk-itsolutions.com/api/v1/repos/homeiot/sigil/releases"
          curl -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: token $REPO_ACCESS_TOKEN" \
            -d "{
              \"tag_name\": \"$TAG_NAME\",
              \"name\": \"Release $TAG_NAME\",
              \"body\": \"Automated release for crate $CRATE_NAME $VERSION.\",
              \"draft\": false,
              \"prerelease\": $PRERELEASE
            }"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Publish crate to Forgejo RC registry
        if: env.PRERELEASE == 'true'
        run: cargo publish --registry forgejorc

      - name: Publish crate to Forgejo stable registry
        if: env.PRERELEASE != 'true'
        run: cargo publish --registry forgejo
