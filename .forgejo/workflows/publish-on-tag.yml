# On push of tag v*: run shared Rust checks, then Forgejo release + cargo
# publish (forgejorc for *-rc* tags, forgejo for stable tags).
# Implementation: faicel/central_ci publish_on_tag.yml.
# Repository is auto-detected from github.repository (caller).
#
# The callee defaults enable_tag_check to false because the tag is the workflow
# trigger. test_command: the crate's authoritative gate (locked feature matrix,
# rustdoc, embedded-target cross-checks). The plain `cargo test` default is
# invalid here: the empty feature set is rejected at compile time by design.

name: Publish release on tag

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    uses: faicel/central_ci/.forgejo/workflows/publish_on_tag.yml@main
    with:
      test_command: bash scripts/test.sh
    secrets:
      RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
