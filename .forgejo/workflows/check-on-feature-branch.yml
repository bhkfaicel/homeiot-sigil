# On push to any branch EXCEPT dev, staging, and main: run shared Rust checks.
# No tag, no publish. Used for feature branches.
#
# Requires: RUNNER_TOKEN secret (PAT with read repo).
# Checks are local so workflow code and third-party actions stay immutable.

name: Run checks on feature branches

on:
  push:
    branches:
      - "*"
      - "!dev"
      - "!staging"
      - "!main"

jobs:
  checks:
    uses: ./.forgejo/workflows/_rust-crate-checks.yml
    with:
      test_command: bash scripts/test.sh
    secrets: inherit
