# On push to `dev`: run shared Rust checks, then create and push prerelease tag
# `vX.Y.Z-rc`. Implementation: faicel/central_ci create_tag_on_dev.yml.
# Repository is auto-detected from github.repository (caller).
#
# Cargo.toml stays at the stable base version (e.g. 1.2.0); the `-rc` suffix is
# tag-only. The tag push triggers publish-on-tag.yml (forgejorc registry).
# test_command: the crate's authoritative gate (locked feature matrix, rustdoc,
# embedded-target cross-checks). The plain `cargo test` default is invalid here:
# the empty feature set is rejected at compile time by design.

name: Create tag on dev

on:
  push:
    branches:
      - dev

jobs:
  tag:
    uses: faicel/central_ci/.forgejo/workflows/create_tag_on_dev.yml@main
    with:
      test_command: bash scripts/test.sh
      enable_deny: true
    secrets:
      RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
